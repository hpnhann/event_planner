<!DOCTYPE html>
<html>
<head>
    <title>Test JSON</title>
</head>
<body>
    <button onclick="testJSON()">Test JSON Response</button>
    <div id="result"></div>

    <script>
        function testJSON() {
            fetch('test_json.php')
                .then(response => response.text())
                .then(text => {
                    console.log('Raw response:', text);
                    document.getElementById('result').innerHTML = '<pre>' + text + '</pre>';
                    try {
                        const json = JSON.parse(text);
                        alert('JSON OK: ' + json.message);
                    } catch (e) {
                        alert('JSON Error: ' + e.message);
                    }
                });
        }
    </script>
</body>
</html>
